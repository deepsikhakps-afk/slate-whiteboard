<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slate — Browser Whiteboard</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="app">
    <!-- Toolbar -->
    <aside class="toolbar">
      <div class="brand">Slate</div>

      <div class="tool-group">
        <button class="tool-btn active" data-tool="pen" title="Pen">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" title="Eraser">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 20H8l-6-6a2 2 0 0 1 0-2.8L13 2l9 9-7 7"/></svg>
        </button>
        <button class="tool-btn" data-tool="line" title="Line">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 20 20 4"/></svg>
        </button>
        <button class="tool-btn" data-tool="rect" title="Rectangle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="4" y="6" width="16" height="12" rx="1"/></svg>
        </button>
        <button class="tool-btn" data-tool="circle" title="Circle">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="8"/></svg>
        </button>
        <button class="tool-btn" data-tool="arrow" title="Arrow">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 19 19 5"/><path d="M9 5h10v10"/></svg>
        </button>
        <button class="tool-btn" data-tool="text" title="Text">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 6h14"/><path d="M12 6v14"/><path d="M9 20h6"/></svg>
        </button>
      </div>

      <div class="divider"></div>

      <div class="control">
        <label>Color</label>
        <div class="swatches" id="swatches"></div>
        <input type="color" id="colorPicker" value="#eae6ff">
      </div>

      <div class="control">
        <label>Size <span id="sizeVal">4</span>px</label>
        <input type="range" id="sizeSlider" min="1" max="40" value="4">
      </div>

      <div class="divider"></div>

      <div class="control fill-control">
        <label><input type="checkbox" id="fillShape"> Fill shape</label>
      </div>

      <div class="divider"></div>

      <div class="tool-group actions">
        <button id="undoBtn" title="Undo">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-1"/></svg>
        </button>
        <button id="redoBtn" title="Redo">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m15 14 5-5-5-5"/><path d="M20 9H9a5 5 0 0 0 0 10h1"/></svg>
        </button>
        <button id="clearBtn" title="Clear canvas">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>
        </button>
      </div>

      <button id="exportBtn" class="export-btn">Export PNG</button>
    </aside>

    <!-- Canvas area -->
    <main class="canvas-wrap">
      <canvas id="board"></canvas>
      <div id="textInputLayer"></div>
    </main>
  </div>

  <script src="js/history.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
